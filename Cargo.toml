[package]
name = "semantic_triples"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
env_logger = "0.11"
parol_runtime = "5.0.0"
scnr2 = "0.5.2"
thiserror = "2.0"

[build-dependencies]
parol = "5.0.0"
parol_runtime = "5.0.0"

# For faster builds.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3
